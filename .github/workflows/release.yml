name: Release

# Creates a draft GitHub release with generated notes for every version tag.
# Publishing the draft triggers the "Publish" workflow.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: mikepenz/action-gh-release@7a1a2d94070db8d22681770f42cdb85a9c38d6ac # v3
        with:
          draft: true
          generate_release_notes: true
