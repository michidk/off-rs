name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Not a release tag: %s\n' "$TAG_NAME" >&2
            exit 1
          fi

  publish-cratesio:
    name: Publish to crates.io
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: "publish-crates.io"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # This plugin should be loaded after toolchain setup
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "v$version" != "$TAG_NAME" ]]; then
            printf 'Tag %s does not match the crate version %s\n' "$TAG_NAME" "$version" >&2
            exit 1
          fi

      - name: Run tests
        run: cargo test --all-targets

      - name: Upload to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
